<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>CONFIG EMAIL - BLUE PRO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00BFFF">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    
    :root {
      --primary: #00BFFF;
      --primary-glow: rgba(0,191,255,0.6);
      --dark: #0a0e14;
      --card: rgba(10,20,30,0.85);
      --border: #00BFFF;
      --text: #E0F7FF;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }
    
    body {
      background: #000 url('https://i.imgur.com/3aQz1vN.jpg') center/cover fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(0,191,255,0.1), rgba(0,0,0,0.9));
      z-index: -1;
    }

    /* ANIMASI BACKGROUND PARTICLE */
    .particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      width: 2px; height: 2px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--primary);
      animation: float 15s infinite linear;
    }
    @keyframes float {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-10vh) translateX(100px); opacity: 0; }
    }

    .wrapper {
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 20px;
      padding: 25px 20px;
      box-shadow: 0 0 20px var(--primary-glow), inset 0 0 20px rgba(0,191,255,0.1);
      backdrop-filter: blur(10px);
      animation: cardGlow 3s infinite alternate;
    }
    @keyframes cardGlow {
      0% { box-shadow: 0 0 15px var(--primary-glow), inset 0 0 20px rgba(0,191,255,0.1); }
      100% { box-shadow: 0 0 30px var(--primary-glow), inset 0 0 25px rgba(0,191,255,0.2); }
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      color: var(--primary);
      font-size: 18px;
      font-weight: 700;
      text-shadow: 0 0 10px var(--primary);
      letter-spacing: 2px;
    }
    .card-header i {
      font-size: 20px;
      filter: drop-shadow(0 0 5px var(--primary));
    }

    .input-group {
      margin-bottom: 18px;
    }
    input, select {
      width: 100%;
      padding: 15px 18px;
      background: rgba(0,0,0,0.6);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      font-family: 'Orbitron', sans-serif;
      transition: 0.3s;
    }
    input:focus, select:focus {
      outline: none;
      border: 2px solid #00FFFF;
      box-shadow: 0 0 15px var(--primary-glow);
    }
    input::placeholder {
      color: #4a7a8a;
      letter-spacing: 1px;
    }

    .btn-add {
      width: 100%;
      padding: 16px;
      background: linear-gradient(45deg, #0088CC, var(--primary));
      color: #000;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 20px var(--primary-glow);
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
    .btn-add:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px var(--primary-glow);
    }
    .btn-add:active { transform: scale(0.97); }

    /* TABEL LIST */
    .table-wrap {
      margin-top: 10px;
    }
    .table-header {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      padding: 12px 0;
      border-bottom: 2px solid var(--border);
      color: var(--primary);
      font-weight: 700;
      font-size: 14px;
      text-shadow: 0 0 8px var(--primary);
      letter-spacing: 1px;
    }
    .table-empty {
      text-align: center;
      padding: 25px 0;
      color: #4a7a8a;
      font-size: 14px;
      letter-spacing: 1px;
    }
    .email-item {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      padding: 12px 0;
      border-bottom: 1px solid rgba(0,191,255,0.2);
      font-size: 13px;
      align-items: center;
    }
    .badge-sukses {
      background: rgba(0,255,136,0.2);
      color: #00ff88;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      text-align: center;
      border: 1px solid #00ff88;
    }
    .btn-hapus {
      background: rgba(255,0,0,0.2);
      color: #ff4444;
      border: 1px solid #ff4444;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-family: 'Orbitron', sans-serif;
    }

    /* PLAY MUSIC BUTTON */
    .music-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 50px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 0 20px var(--primary-glow);
      transition: 0.3s;
    }
    .music-btn:hover {
      box-shadow: 0 0 35px var(--primary-glow);
      transform: scale(1.05);
    }
    .music-icon {
      width: 35px;
      height: 35px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      box-shadow: 0 0 15px var(--primary);
    }
    .music-text {
      color: var(--primary);
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1px;
      text-shadow: 0 0 8px var(--primary);
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: #4a7a8a;
      letter-spacing: 2px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <div class="wrapper">
    <!-- CARD 1: CONFIG EMAIL -->
    <div class="card">
      <div class="card-header">
        <i class="fa-solid fa-crosshairs"></i> CONFIG EMAIL
      </div>
      <div class="input-group">
        <input type="email" id="emailInput" placeholder="emailkamu@gmail.com">
      </div>
      <div class="input-group">
        <input type="number" id="jumlahInput" placeholder="Jumlah" value="1" min="1">
      </div>
      <button class="btn-add" onclick="tambahEmail()">
        TAMBAHKAN EMAIL
      </button>
    </div>

    <!-- CARD 2: LIST EMAIL -->
    <div class="card">
      <div class="card-header">
        <i class="fa-solid fa-database"></i> LIST DAFTAR EMAIL AKTIV
      </div>
      <div class="table-wrap">
        <div class="table-header">
          <div>EMAIL</div>
          <div>RESULT</div>
          <div>AKSI</div>
        </div>
        <div id="listEmail">
          <div class="table-empty">Belum ada email terdaftar</div>
        </div>
      </div>
    </div>

    <div class="footer">CREATED SYSTEM BY BLUE PRO v2.0</div>
  </div>

  <!-- MUSIC BUTTON -->
  <div class="music-btn" onclick="toggleMusic()">
    <div class="music-icon">
      <i class="fa-solid fa-play" id="musicIcon"></i>
    </div>
    <div class="music-text">PLAY MUSIC</div>
  </div>

  <audio id="bgMusic" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <script>
    // PARTICLE ANIMATION
    function buatParticle() {
      const particles = document.getElementById('particles');
      for (let i = 0; i < 50; i++) {
        let particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 15 + 's';
        particle.style.animationDuration = Math.random() * 10 + 10 + 's';
        particles.appendChild(particle);
      }
    }
    buatParticle();

    // TAMBAH EMAIL KE LIST
    let emailList = [];
    function tambahEmail() {
      const email = document.getElementById('emailInput').value;
      const jumlah = document.getElementById('jumlahInput').value;
      
      if (!email || !email.includes('@')) {
        alert('Masukkan email yang valid bro!');
        return;
      }

      for (let i = 0; i < jumlah; i++) {
        emailList.push({
          email: email,
          result: 'Sukses'
        });
      }
      
      renderList();
      document.getElementById('emailInput').value = '';
      document.getElementById('jumlahInput').value = '1';
    }

    function renderList() {
      const listEl = document.getElementById('listEmail');
      
      if (emailList.length === 0) {
        listEl.innerHTML = '<div class="table-empty">Belum ada email terdaftar</div>';
        return;
      }

      listEl.innerHTML = emailList.map((item, index) => `
        <div class="email-item">
          <div>${item.email}</div>
          <div><span class="badge-sukses">${item.result}</span></div>
          <div><button class="btn-hapus" onclick="hapusEmail(${index})">HAPUS</button></div>
        </div>
      `).join('');
    }

    function hapusEmail(index) {
      emailList.splice(index, 1);
      renderList();
    }

    // MUSIC PLAYER
    let isPlaying = false;
    const music = document.getElementById('bgMusic');
    const musicIcon = document.getElementById('musicIcon');

    function toggleMusic() {
      if (isPlaying) {
        music.pause();
        musicIcon.className = 'fa-solid fa-play';
      } else {
        music.play();
        musicIcon.className = 'fa-solid fa-pause';
      }
      isPlaying = !isPlaying;
    }
  </script>
</body>
</html>
